name: QV Legendary Continuous Paper

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  qv-paper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Quantitative Analysis Engine
        run: python qv_quant_analyzer.py

      - name: Upload Analysis Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: qv-quantitative-report
          path: qv_output/quantitative_analysis_report.json
          
